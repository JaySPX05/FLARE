name: CI

# Deliberately minimal: catches "does it even run" problems, nothing heavy.
# A slow CI during a sprint is worse than no CI — people start skipping it.

on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main, dev]

jobs:
  python-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Syntax check all Python
        run: |
          python -m compileall -q data-pipeline ml-nowcasting backend-api hydrology-swmm || true
          echo "Python syntax check complete"

  contract-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: API contract must stay valid JSON
        run: python -c "import json; json.load(open('contracts/risk-api-schema.json')); print('contract OK')"

  no-large-files:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Block accidentally committed large files
        run: |
          BIG=$(find . -path ./.git -prune -o -type f -size +50M -print)
          if [ -n "$BIG" ]; then
            echo "Files over 50MB found — these should be gitignored:"
            echo "$BIG"
            exit 1
          fi
          echo "No oversized files"
