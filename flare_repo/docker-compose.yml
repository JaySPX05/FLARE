# FLARE - run the whole stack locally:
#     docker compose up --build
# then open http://localhost:8080
#
# Offline data pipeline (on demand, needs ./data populated):
#     docker compose run --rm pipeline scripts/04_rainfall_multiplier.py
#
# On the Azure VM (pip downloads stall inside Docker's build network), build with
#     bash infra/docker/build-host-network.sh      (builds all images, then starts them)
#
# Live IMD data: the `ingest` service polls IMD and writes into the shared
# live-data volume; the api and routing services pick new files up on their
# own. IMD access is IP-whitelisted, so run this on the approved network.
# Check access once with:
#     docker compose run --rm ingest python live-ingest/probe_imd.py
# Present the recorded storm instead (e.g. on a dry day):
#     FLARE_DATA_MODE=demo docker compose up    (or open the dashboard with ?source=demo)
name: flare

services:
  api:
    build:
      context: .
      dockerfile: infra/docker/api.Dockerfile
    ports:
      - "8000:8000"          # optional: http://localhost:8000/docs
    environment:
      FLARE_DATA_MODE: ${FLARE_DATA_MODE:-auto}   # auto = live IMD when available, else demo
    volumes:
      - live-data:/app/data/live:ro
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/')"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  routing:
    build:
      context: .
      dockerfile: infra/docker/routing.Dockerfile
    ports:
      - "8001:8001"          # optional: http://localhost:8001/docs
    environment:
      FLARE_DATA_MODE: ${FLARE_DATA_MODE:-auto}
    volumes:
      - live-data:/app/data/live:ro
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8001/')"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 90s      # room for a live OSM download if no saved graph is baked in
    restart: unless-stopped

  frontend:
    build:
      context: .
      dockerfile: infra/docker/frontend.Dockerfile
    ports:
      - "8080:8080"
    environment:
      API_UPSTREAM: http://api:8000
      ROUTING_UPSTREAM: http://routing:8001
    depends_on:
      api:
        condition: service_healthy
      routing:
        condition: service_healthy
    restart: unless-stopped

  ingest:
    build:
      context: .
      dockerfile: infra/docker/ingest.Dockerfile
    # Runs on the host's network: on the Azure VM, connections from Docker's own
    # build network to PyPI stalled. The ingest only talks to IMD and writes to the
    # shared volume - it exposes no ports, so nothing changes for the other services.
    # (On that VM, build images with infra/docker/build-host-network.sh.)
    network_mode: host
    env_file:
      - path: .env           # IMD settings from probe_imd.py (optional file)
        required: false
    volumes:
      - live-data:/app/data/live
    restart: unless-stopped

  pipeline:
    profiles: ["pipeline"]   # never started by a plain `docker compose up`
    build:
      context: .
      dockerfile: infra/docker/pipeline.Dockerfile
    volumes:
      - ./data:/app/data

volumes:
  live-data:
